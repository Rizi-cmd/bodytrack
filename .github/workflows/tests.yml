# Runs the unit tests and the WebKit (iPhone engine) smoke test on every push.
# Uses only the invented fixture in tests/fixtures. No secrets, read-only access.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-results
          path: test-results/
          if-no-files-found: ignore

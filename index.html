<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyTrack</title>
<meta name="theme-color" content="#0f0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BodyTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header>
    <h1>BodyTrack</h1>
    <span class="tag" id="ver"></span>
  </header>

  <div class="note warn" id="backupNag" hidden></div>

  <section class="card" id="summary">
    <div class="empty" id="emptyState">
      <b>אין עדיין נתונים במכשיר</b>
      <span class="muted">מייבאים קובץ גיבוי, או מתחילים לרשום בשלב הבא.</span>
    </div>
    <div id="sumBody" hidden>
      <div class="muted">שקילה אחרונה</div>
      <div class="big"><span id="lastKg"></span><small>ק״ג</small></div>
      <div class="muted" id="lastDate"></div>
      <div class="stats">
        <div><b id="nW"></b><span>שקילות</span></div>
        <div><b id="nM"></b><span>ימי מדידה</span></div>
        <div><b id="since"></b><span>מאז</span></div>
      </div>
    </div>
  </section>

  <div class="seg" role="tablist">
    <button role="tab" aria-selected="true" data-list="w">שקילות</button>
    <button role="tab" aria-selected="false" data-list="m">היקפים</button>
  </div>
  <section class="card list" id="listW"></section>
  <section class="card list" id="listM" hidden></section>

  <section class="card stack">
    <h2>גיבוי</h2>
    <p class="muted" id="backupInfo"></p>
    <button class="btn primary" id="exportBtn">שמירת גיבוי לקבצים</button>
    <label class="btn ghost" for="importFile">שחזור מקובץ גיבוי</label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </section>

  <p class="muted foot">הנתונים נשמרים רק במכשיר הזה. מחיקת האפליקציה ממסך הבית מוחקת אותם, ולכן חשוב לגבות.</p>
</div>

<!-- import confirm sheet -->
<div class="sheet" id="importSheet" hidden>
  <div class="sheetBox stack">
    <h2>שחזור מגיבוי</h2>
    <p id="importSummary"></p>
    <div id="importErrors"></div>
    <button class="btn primary" id="impMerge">הוספה לנתונים הקיימים</button>
    <button class="btn danger" id="impReplace">החלפת כל הנתונים במכשיר</button>
    <button class="btn ghost" id="impCancel">ביטול</button>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
